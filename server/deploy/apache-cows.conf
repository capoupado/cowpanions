# Cowpanion pasture server — Apache vhost for cows.carlospoupado.com
# Installed to /etc/apache2/sites-available/cows.conf by deploy/install.sh.
# Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#
# TLS: the :443 block only activates once the Let's Encrypt certificate exists, so
# Apache stays valid before certbot has run. Obtain the certificate with
#   certbot certonly --webroot -w /var/www/html -d cows.carlospoupado.com \
#       --deploy-hook "systemctl reload apache2"
# and reload Apache. If you instead run `certbot --apache`, certbot will edit this
# file (adding SSLCertificateFile lines / a -le-ssl.conf copy) — that also works,
# just keep the proxy directives intact.

<VirtualHost *:80>
    ServerName cows.carlospoupado.com
    DocumentRoot /var/www/html

    # Everything except the ACME challenge goes to https.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/cows/error.log
    CustomLog ${APACHE_LOG_DIR}/cows/access.log combined
</VirtualHost>

<IfFile /etc/letsencrypt/live/cows.carlospoupado.com/fullchain.pem>
<VirtualHost *:443>
    ServerName cows.carlospoupado.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cows.carlospoupado.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cows.carlospoupado.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Nothing but the WebSocket endpoint is served here.
    DocumentRoot /var/www/html
    <Location />
        Require all denied
    </Location>
    <Location /ws>
        Require all granted
    </Location>

    ProxyPreserveHost On
    ProxyAddHeaders On
    # Default is 60s, which coincides with the 60s eviction window and turns idle
    # connections into a reconnect loop. Keep this well above it.
    ProxyTimeout 300

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:8787/ws [P,L]

    ProxyPass        /ws  ws://127.0.0.1:8787/ws
    ProxyPassReverse /ws  ws://127.0.0.1:8787/ws

    Header always set Strict-Transport-Security "max-age=31536000"

    # Own log files: rotated by /etc/logrotate.d/apache-cows with 7-day retention
    # (privacy rule: access logs hold client IPs), and watched by fail2ban.
    ErrorLog  ${APACHE_LOG_DIR}/cows/error.log
    CustomLog ${APACHE_LOG_DIR}/cows/access.log combined
</VirtualHost>
</IfFile>
