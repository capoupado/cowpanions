# fail2ban jail for connection-attempt floods against the Cowpanion vhost.
# Installed to /etc/fail2ban/jail.d/cowpanion.conf. The filter is inlined
# (fail2ban accepts failregex directly in a jail section) so this is one file.
#
# A legitimate client connects once and then holds the socket for hours; even a
# flapping network gives a handful of reconnects per minute thanks to the mandatory
# backoff. 30 upgrade attempts from one address in 60s is a flood.
#
# Note: a ban blocks *all* new packets from that address to :80/:443, including any
# legitimate client behind the same NAT. Members on other addresses are unaffected.

[cowpanion]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/cows/access.log
backend  = auto
maxretry = 30
findtime = 60
bantime  = 600
# Any request line for /ws in Apache "combined" format: successful upgrades (101),
# refusals from the server (429 per-IP cap, 503 during restart) and junk (4xx).
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(?:GET|POST|HEAD) /ws(?:[ ?].*)?" \d{3}
ignoreregex =
