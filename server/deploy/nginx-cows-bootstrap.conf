# Cowpanion pasture server — nginx site for cows.carlospoupado.com, BEFORE the TLS
# certificate exists. Installed by deploy/install.sh as /etc/nginx/sites-available/cows
# when /etc/letsencrypt/live/cows.carlospoupado.com/ is missing; replaced by
# nginx-cows.conf on the next install.sh run after certbot has succeeded.
#
# Serves only the ACME challenge; everything else redirects to https (which will not
# answer until the certificate is in place).

server {
    listen 80;
    listen [::]:80;
    server_name cows.carlospoupado.com;

    access_log /var/log/nginx/cows/access.log combined;
    error_log  /var/log/nginx/cows/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
