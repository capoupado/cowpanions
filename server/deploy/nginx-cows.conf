# Cowpanion pasture server — nginx site for cows.carlospoupado.com.
# Installed to /etc/nginx/sites-available/cows by deploy/install.sh once the Let's
# Encrypt certificate exists (until then nginx-cows-bootstrap.conf is used, because
# nginx refuses to start with ssl_certificate pointing at a missing file).
#
# Certificate:
#   certbot certonly --webroot -w /var/www/html -d cows.carlospoupado.com \
#       --deploy-hook "systemctl reload nginx"
# `certbot --nginx` also works; it would edit this file in place — keep the /ws block.

# The domain is proxied by Cloudflare, so $remote_addr is a Cloudflare edge address. The
# real client IP arrives in CF-Connecting-IP; fall back to $remote_addr when it is absent
# (direct hits, or if the Cloudflare proxy is ever switched off).
map $http_cf_connecting_ip $cow_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name cows.carlospoupado.com;

    access_log /var/log/nginx/cows/access.log combined;
    error_log  /var/log/nginx/cows/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cows.carlospoupado.com;

    ssl_certificate     /etc/letsencrypt/live/cows.carlospoupado.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cows.carlospoupado.com/privkey.pem;
    # Inline TLS settings rather than certbot's options-ssl-nginx.conf, which only exists
    # when the certbot nginx plugin is installed (the runbook uses the webroot flow).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Own log files, rotated by /etc/logrotate.d/nginx-cows with 7-day retention
    # (privacy rule: access logs hold client IPs).
    access_log /var/log/nginx/cows/access.log combined;
    error_log  /var/log/nginx/cows/error.log;

    # Nothing but the WebSocket endpoint is served here. /healthz stays localhost-only
    # on the Node side and is deliberately not proxied.
    location / {
        return 403;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8787/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The server trusts the first hop of X-Forwarded-For for its per-IP cap; only
        # nginx can reach 127.0.0.1:8787, so set it explicitly rather than appending.
        proxy_set_header X-Forwarded-For $cow_client_ip;
        proxy_set_header X-Real-IP $cow_client_ip;

        # nginx's default proxy_read_timeout is 60s, which coincides with the 60s
        # eviction window and turns idle connections into a reconnect loop. Clients
        # ping every 20s, so 300s leaves ample margin.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
